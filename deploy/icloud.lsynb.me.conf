server {
    server_name icloud.lsynb.me;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/icloud.lsynb.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/icloud.lsynb.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = icloud.lsynb.me) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name icloud.lsynb.me;
    return 404;
}
